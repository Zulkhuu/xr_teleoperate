[project]
name = "xr-teleoperate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anytree>=2.12.0",
    "casadi==3.6.7",
    "dex-retargeting",
    "lxml>=5.2.2",
    "matplotlib==3.7.5",
    "meshcat==0.3.2",
    "scipy>=1.10",
    "nlopt>=2.6.1,<2.8.0",
    "params-proto==2.13.2",
    "pymodbus==3.6.9",
    "pytransform3d>=3.5.0",
    "pyyaml>=6.0.0",
    "rerun-sdk==0.20.1",
    "sshkeyboard==2.3.1",
    "teleimager",
    "televuer",
    "torch==2.3.0",
    "trimesh>=4.4.0",
    "unitree-sdk2py",
]

[tool.uv.workspace]
members = [
    "teleop/teleimager",
    "teleop/televuer",
    "teleop/robot_control/dex-retargeting",
]

[tool.uv.sources]
teleimager = { workspace = true }
televuer = { workspace = true }
unitree-sdk2py = { path = "../unitree_sdk2_python", editable = true }

dex-retargeting = { workspace = true }
